<!doctype html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>砂与星 · 星图原型</title>
<link rel="icon" href="data:,">
<!-- 字体与站点同源：仓库里 npm i 之后从 node_modules 取；直接双击打开又没装依赖时落回系统衬线体。
     推荐用 `npx vite` 起在仓库根目录，然后打开 /docs/redesign-2026-09/sand-and-stars-prototype.html -->
<link rel="stylesheet" href="../../node_modules/lxgw-wenkai-screen-webfont/lxgwwenkaigbscreen.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/eb-garamond/400.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/eb-garamond/400-italic.css">
<link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/400.css">
<style>
/* ══ 令牌：全部取自全站（index.css / OasisDock / OasisLights），不新造颜色 ══════════════ */
:root{
  --font-serif:"EB Garamond","LXGW WenKai Screen","Songti SC","Noto Serif SC",ui-serif,Georgia,serif;
  --font-zh:"LXGW WenKai Screen","Songti SC","Noto Serif SC",ui-serif,serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --teal:#39C5BB; --sakura:#FFB7C5;
  --ease:cubic-bezier(.16,1,.3,1);
}
/* 昼：站点纸色 #FAF8F3 + 季节光。星图不再自带天幕。 */
[data-theme=day]{
  --paper:#FAF8F3; --ink:#334155; --ink2:#64748B; --ink3:#94A3B8;
  --accent:#39C5BB; --accent-ink:#1B7A74;
  --glass:rgba(255,255,255,.55); --glass-edge:rgba(255,255,255,.72); --line:rgba(148,163,184,.26);
  --shadow:0 18px 50px -30px rgba(15,23,42,.35);
  --ring-base:#64748B; --ring-o:.2; --ring-in-o:.32; --rake:rgba(100,116,139,.085);
  --pool:transparent;
  --stone:#B8B0A3; --stone-rim:rgba(71,85,105,.28);
  --step:#D4CCBF; --step-rim:#B3AA9C;
  --bridge:rgba(100,116,139,.5);
  --stone-o:1; --star-o:0; --dim:.24;
  --halo-stroke:rgba(250,248,243,.92);
}
/* 夜：站点夜墨 #0A0F1D + 萤火。与 Dock 暗态的 #66DED5 同一支绿。 */
[data-theme=night]{
  --paper:#0A0F1D; --ink:#E2E8F0; --ink2:#94A3B8; --ink3:#64748B;
  --accent:#66DED5; --accent-ink:#6FD8CF;
  --glass:rgba(12,18,34,.68); --glass-edge:rgba(255,255,255,.09); --line:rgba(255,255,255,.09);
  --shadow:0 20px 48px -20px rgba(0,0,0,.72);
  --ring-base:#66DED5; --ring-o:.09; --ring-in-o:.17; --rake:rgba(102,222,213,.018);
  --pool:rgba(102,222,213,.022);
  --bridge:rgba(255,183,197,.62);
  --stone-o:0; --star-o:1; --dim:.2;
  --halo-stroke:rgba(10,15,29,.9);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  transition:background-color 1.2s ease,color 1.2s ease}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
/* 季节光：与 App.tsx 的暖纸底光同一配方（秋：琥珀 + 极淡青） */
.wash{position:fixed;inset:0;pointer-events:none;transition:opacity 1.2s ease;
  background:radial-gradient(120% 90% at 15% 12%,rgba(253,226,196,.55) 0%,rgba(250,248,243,.45) 42%,transparent 70%),
             radial-gradient(90% 80% at 88% 92%,rgba(57,197,187,.07) 0%,transparent 60%)}
[data-theme=night] .wash{opacity:0}
.vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 150px rgba(0,0,0,.05)}
[data-theme=night] .vignette{box-shadow:inset 0 0 150px rgba(0,0,0,.8)}
#fx{position:fixed;inset:0;pointer-events:none;opacity:.6}

/* HUD：四角的 + 与时钟，与 OasisHUD 一致 */
.hud{position:fixed;inset:32px;pointer-events:none;opacity:.3;color:#94A3B8;font:12px var(--font-mono)}
.hud i{position:absolute;font-style:normal;line-height:1}
.hud .clock{position:absolute;right:0;top:24px;font-size:10px;letter-spacing:.3em}
.pills{position:fixed;top:32px;left:32px;display:flex;gap:12px;z-index:30}
.pill{display:flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:999px;
  font:9px var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 1px 2px rgba(15,23,42,.05);transition:color .5s,border-color .5s}
.pill:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.pill[aria-pressed=true]{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.scale{position:fixed;top:78px;right:32px;z-index:30;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;
  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);font:9px var(--font-mono);letter-spacing:.16em;color:var(--ink3)}
.scale span{padding:0 8px 0 10px}
.scale button{padding:6px 10px;border-radius:999px;color:var(--ink2)}
.scale button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}

/* 场所页头：与 Lanterns / Atelier 同款——英文等宽小字 + 衬线斜体一句 */
.place-head{position:fixed;top:92px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none;width:min(560px,80vw)}
.eyebrow{font:10px var(--font-mono);letter-spacing:.5em;text-transform:uppercase;color:var(--ink3)}
.place-head .eyebrow{color:color-mix(in srgb,var(--accent) 80%,transparent)}
.place-head p{margin:10px 0 0;font-style:italic;font-size:14px;color:var(--ink3)}

/* ══ 地图 ═════════════════════════════════════════════════════════════════ */
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#stage.dragging{cursor:grabbing}
.rk{fill:none;stroke:var(--rake);stroke-width:1;vector-effect:non-scaling-stroke}
/* 砂纹按庭各算一套，带一丝分类色：庭与庭的边界就是目录的一级标题 */
.rg{fill:none;stroke:color-mix(in oklab,var(--c,#64748B) 34%,var(--ring-base));stroke-opacity:var(--ring-o);stroke-width:1;vector-effect:non-scaling-stroke;transition:stroke .8s,stroke-opacity .8s}
.rg.in{stroke-opacity:var(--ring-in-o)}
.poolfill{fill:var(--pool);stroke:none}
.topic{fill:color-mix(in srgb,var(--sakura) 12%,transparent);stroke:var(--sakura);stroke-width:1.2;stroke-dasharray:4 5;
  vector-effect:non-scaling-stroke;opacity:0;transition:opacity .35s}
.topic.on{opacity:1}
.kelp{fill:none;stroke:var(--sakura);stroke-width:1.2;stroke-dasharray:1 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
/* 小径：昼是飞石（圆头短划 = 一块块踏石），夜是星座连线 */
.step-a{fill:none;stroke:var(--step-rim);stroke-width:7.4;stroke-linecap:round;stroke-dasharray:.1 13;vector-effect:non-scaling-stroke;opacity:var(--stone-o)}
.step-b{fill:none;stroke:var(--step);stroke-width:5.6;stroke-linecap:round;stroke-dasharray:.1 13;vector-effect:non-scaling-stroke;opacity:var(--stone-o)}
.chain{fill:none;stroke:rgba(226,232,240,.5);stroke-width:1;vector-effect:non-scaling-stroke;opacity:var(--star-o)}
.path.lit .chain{stroke:rgba(226,232,240,.9)}
.path.lit .step-b{stroke:color-mix(in srgb,var(--accent) 45%,var(--step))}
/* 桥：双链。昼是石桥（双线），夜是鹊桥（樱粉虚线） */
.br-a{fill:none;stroke:var(--bridge);stroke-width:3.6;vector-effect:non-scaling-stroke;opacity:var(--stone-o)}
.br-b{fill:none;stroke:var(--paper);stroke-width:1.8;vector-effect:non-scaling-stroke;opacity:var(--stone-o)}
.br-n{fill:none;stroke:var(--bridge);stroke-width:1.1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:var(--star-o)}
.hit{fill:none;stroke:transparent;stroke-width:12;vector-effect:non-scaling-stroke;pointer-events:stroke}
.spoke{fill:none;stroke:color-mix(in srgb,var(--accent) 70%,transparent);stroke-width:1;stroke-dasharray:1 4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.rel{transition:opacity .35s}
.rel.dim{opacity:.18}

/* 石 / 星：同一个节点两种光，靠令牌交叉淡入，不换几何 */
.node{transition:opacity .4s ease}
.node.dim{opacity:var(--dim)}
.node.future{opacity:0;pointer-events:none}
.stone{opacity:var(--stone-o);transition:opacity 1s ease}
.star{opacity:var(--star-o);transition:opacity 1s ease}
.st-shadow{fill:rgba(15,23,42,.10)}
.st-body{fill:color-mix(in oklab,var(--c) 20%,var(--stone));stroke:var(--stone-rim);stroke-width:.8}
.st-body.seed{fill:color-mix(in srgb,var(--paper) 70%,transparent);stroke:color-mix(in oklab,var(--c) 38%,#94A3B8);stroke-width:1}
.st-hi{fill:rgba(255,255,255,.5)}
.st-moss{fill:color-mix(in oklab,var(--c) 70%,#2F6B55)}
.sr-core{fill:color-mix(in oklab,var(--c) 22%,#fff)}
.sr-core.seed{opacity:.55}
.sr-spark{fill:color-mix(in oklab,var(--c) 35%,#fff);opacity:.9}
.sel-ring{fill:none;stroke:var(--accent);stroke-width:1.3;opacity:0;transition:opacity .3s}
.node.sel .sel-ring{opacity:1}
.care{fill:none;stroke:var(--sakura);stroke-width:1.1;stroke-dasharray:2 3;opacity:0;transition:opacity .3s}
body.care-on .node.tend .care{opacity:.95}
.fresh{fill:none;stroke:var(--sakura);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:fresh 5s var(--ease) infinite}
[data-theme=night] .fresh{stroke:var(--accent)}
@keyframes fresh{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(3.4);opacity:0}}
.bloom{fill:none;stroke:var(--accent);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:bloom 1.5s var(--ease) forwards}
.bloom.b2{stroke:var(--sakura);animation-delay:.18s;opacity:0}
@keyframes bloom{0%{transform:scale(.6);opacity:.8}100%{transform:scale(5.5);opacity:0}}

/* 注记：字号只用站内阶梯 16 / 13 / 11 / 10 */
.lbl{paint-order:stroke fill;stroke:var(--halo-stroke);stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;transition:opacity .3s}
.l-star{font:13px var(--font-zh);letter-spacing:.06em;fill:var(--ink)}
.l-isl{font:16px var(--font-zh);letter-spacing:.14em;fill:var(--ink)}
.l-isl-en{font:10px var(--font-mono);letter-spacing:.24em;fill:var(--ink3);text-transform:uppercase}
.l-ser{font:11px var(--font-mono);letter-spacing:.22em;fill:var(--ink2)}
.l-ser.zh{font:12px var(--font-zh);letter-spacing:.16em}
.isl-dot{fill:var(--c)}
.moon{fill:#F4F1EA}
.moon-dark{fill:#0A0F1D}

/* ══ 玻璃面板：OasisLights 的光茧 / Dock 同一配方 ══════════════════════════════ */
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:24px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);
  transition:background-color 1s,border-color 1s}
#rail{position:fixed;left:32px;top:150px;bottom:124px;width:292px;z-index:20;display:flex;flex-direction:column;overflow:hidden;
  transition:transform .5s var(--ease),opacity .4s}
body.rail-off #rail{transform:translateX(-340px);opacity:0}
.rail-head{padding:20px 20px 12px}
.rail-head .eyebrow{color:color-mix(in srgb,var(--accent) 80%,transparent);letter-spacing:.34em}
.rail-head h3{margin:8px 0 2px;font:400 20px var(--font-zh);letter-spacing:.08em}
.stat{font:10px/1.8 var(--font-mono);letter-spacing:.16em;color:var(--ink3)}
.search{display:flex;align-items:center;gap:8px;margin-top:14px;height:36px;padding:0 14px;border-radius:999px;
  border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 40%,transparent);color:var(--ink3)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:13px var(--font-zh)}
.search kbd{font:9px var(--font-mono);border:1px solid var(--line);border-radius:6px;padding:2px 5px}
.rail-body{flex:1;overflow:auto;padding:4px 12px 12px;scrollbar-width:none}
.rail-body::-webkit-scrollbar{display:none}
.cat{margin:8px 0 6px;--ci:color-mix(in oklab,var(--c) 45%,#1e293b)}
[data-theme=night] .cat{--ci:color-mix(in oklab,var(--c) 88%,#f8fafc)}
.row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border-radius:12px;padding:6px 8px;transition:background-color .2s}
.row:hover,.row.hot{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.row.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.cat-h .dot{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent);flex:none}
.cat-h .zh{font:15px var(--font-zh);letter-spacing:.1em}
.cat-h .en{font:9px var(--font-mono);letter-spacing:.22em;color:var(--ci);text-transform:uppercase}
.n{margin-left:auto;font:10px var(--font-mono);color:var(--ink3)}
.ser{margin:2px 0 2px 12px;border-left:1px dashed var(--line);padding-left:6px}
.ser-h{font:11px var(--font-mono);letter-spacing:.14em;color:var(--ink2)}
.ser-h svg{flex:none;color:var(--ci)}
.ser ol,.loose{list-style:none;margin:0;padding:0}
.ser.fold ol{display:none}
.post{font:13px var(--font-zh);color:var(--ink2);letter-spacing:.04em;padding:5px 8px}
.post .no{font:9px var(--font-mono);color:var(--ink3);width:14px;flex:none;text-align:right}
.post .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.post .m{margin-left:auto;font:9px var(--font-mono);color:var(--ink3);flex:none}
.post.hit{color:var(--ink)}
.post.miss{opacity:.32}
.loose{margin-left:12px}
.rail-foot{padding:12px 16px 14px 20px;border-top:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;max-height:52px;overflow:hidden}
.tag{font:9px var(--font-mono);letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);transition:all .2s}
.tag:hover,.tag.on{border-color:color-mix(in srgb,var(--sakura) 70%,transparent);color:color-mix(in oklab,var(--sakura) 55%,var(--ink))}
.legend{display:grid;grid-template-columns:40px 1fr 40px 1fr;row-gap:4px;column-gap:6px;align-items:center;font:9.5px var(--font-mono);letter-spacing:.04em;color:var(--ink3)}
.legend svg{overflow:visible}
.grip{display:none}
.rail-toggle{position:fixed;left:32px;bottom:124px;z-index:21;display:none}
body.rail-off .rail-toggle{display:flex}

/* 星卡 */
#card{position:fixed;right:32px;top:150px;width:340px;max-height:calc(100vh - 290px);overflow:auto;z-index:25;padding:24px 24px 20px;
  opacity:0;transform:translateX(16px);pointer-events:none;transition:opacity .32s var(--ease),transform .32s var(--ease);scrollbar-width:none;
  --ci:color-mix(in oklab,var(--c) 45%,#1e293b)}
[data-theme=night] #card{--ci:color-mix(in oklab,var(--c) 88%,#f8fafc)}
#card.on{opacity:1;transform:none;pointer-events:auto}
#card .x{position:absolute;right:16px;top:14px;width:28px;height:28px;border-radius:999px;color:var(--ink3);font:16px var(--font-mono)}
#card .x:hover{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;padding-right:28px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font:9px var(--font-mono);letter-spacing:.18em;text-transform:uppercase;
  color:var(--ci);background:color-mix(in srgb,var(--paper) 55%,transparent);border:1px solid var(--line)}
.chip i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.ser{text-transform:none;letter-spacing:.1em;color:var(--accent-ink)}
#card h2{margin:0 0 10px;font:400 22px/1.45 var(--font-zh);letter-spacing:.05em}
.meta{font:10px/1.9 var(--font-mono);letter-spacing:.12em;color:var(--ink3);margin-bottom:12px}
.ex{font-size:14px;line-height:1.9;color:var(--ink2);font-style:italic;margin:0 0 16px;white-space:pre-line}
.relh{display:flex;align-items:baseline;gap:8px;font:9px var(--font-mono);letter-spacing:.26em;text-transform:uppercase;color:var(--ink3);margin:16px 0 6px}
.relh b{font:12px var(--font-zh);letter-spacing:.1em;color:var(--ink2);text-transform:none}
.pathbar{display:flex;align-items:center;gap:0;margin:6px 0 8px}
.pathbar button{flex:1;height:18px;display:flex;align-items:center;justify-content:center;position:relative}
.pathbar button::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed var(--line)}
.pathbar button i{position:relative;width:7px;height:7px;border-radius:50%;background:var(--ink3);transition:transform .2s}
.pathbar button.cur i{background:var(--accent);transform:scale(1.5);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.pathbar button:hover i{transform:scale(1.4)}
.pnav{display:flex;justify-content:space-between;gap:12px;font:12px var(--font-zh);color:var(--ink2)}
.pnav button{max-width:48%;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnav button:last-child{text-align:right}
.pnav button:hover{color:var(--accent-ink)}
.rlist{list-style:none;margin:0;padding:0}
.rlist li button{display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;padding:4px 0;font:13px var(--font-zh);color:var(--ink2)}
.rlist li button:hover{color:var(--accent-ink)}
.rlist .why{margin-left:auto;font:9px var(--font-mono);letter-spacing:.1em;color:var(--ink3);flex:none}
.muted{font:12px var(--font-zh);color:var(--ink3);font-style:italic}
.cta{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;height:40px;border-radius:999px;
  font:10px var(--font-mono);letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--teal);box-shadow:0 8px 24px -10px rgba(57,197,187,.7)}
[data-theme=night] .cta{color:#0A0F1D;background:var(--accent)}

/* 工具：与顶栏同款 pill */
.tools{position:fixed;right:32px;bottom:124px;z-index:20;display:flex;gap:10px}
.time{position:fixed;left:50%;bottom:124px;transform:translateX(-50%);z-index:22;display:none;align-items:center;gap:14px;height:44px;padding:0 20px;border-radius:999px;font:10px var(--font-mono);letter-spacing:.14em;color:var(--ink2)}
body.time-on .time{display:flex}
.time input{width:min(38vw,380px);accent-color:var(--teal)}
.toast{position:fixed;left:50%;bottom:128px;transform:translate(-50%,8px);z-index:40;padding:12px 22px;border-radius:999px;font:13px var(--font-zh);color:var(--ink2);opacity:0;transition:all .4s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* Dock 复刻：只为证明它和全站放在一起不违和 */
.dock{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:14px}
.dock nav{display:flex;gap:10px;padding:10px;border-radius:26px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.55);
  backdrop-filter:blur(40px);box-shadow:0 18px 44px -20px rgba(15,23,42,.34),inset 0 1px 0 rgba(255,255,255,.42)}
[data-theme=night] .dock nav{background:rgba(10,15,29,.7);border-color:rgba(255,255,255,.1);box-shadow:0 20px 48px -20px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.08)}
.dock nav span{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#64748B}
[data-theme=night] .dock nav span{color:#94A3B8}
.dock nav span.on{color:#0E8C85;background:rgba(57,197,187,.11);border:1px solid rgba(57,197,187,.2)}
[data-theme=night] .dock nav span.on{color:#66DED5}
.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   砂与星 · 星图第四轮原型
   同一套几何，昼是枯山水砂庭，夜是星池。所有美术笔触都在编码一件数据：
     石 / 星       = 文章（大小 = 篇幅，形 = 生长度）
     庭            = 分类（一组石 + 庭名）
     飞石 / 星座线 = 合集（次序）
     石桥 / 鹊桥   = 双链
     砂纹          = 距离场的等值线（Bubble Sets 同一原理）——悬停话题时收成一个圈
     水纹          = 近三周照料过
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (n, a = {}, p) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const seeded = str => { let h = 0; for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h); const x = Math.sin(h) * 10000; return x - Math.floor(x); };
const DAY = 864e5;
const NOW = Date.parse("2026-09-24T21:40:00+10:00");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* —— 分类：与 useCategories 的内置五类同名同色（AURA），星图不再另起一套光谱色 —— */
const CATS = {
  thought: { zh: "随笔", en: "Thoughts", c: "#39C5BB" },
  weekly:  { zh: "周报", en: "Weekly",   c: "#FFB7C5" },
  note:    { zh: "学习笔记", en: "Notes", c: "#60A5FA" },
  growth:  { zh: "成长", en: "Growth",   c: "#A7F3D0" },
  project: { zh: "项目复盘", en: "Projects", c: "#A78BFA" },
};
const GROW = { seedling: "种子", growing: "生长中", evergreen: "常青" };
const CN = "零一二三四五六七八九十".split("");
const cnNum = n => n <= 10 ? CN[n] : n < 20 ? `十${n % 10 ? CN[n % 10] : ""}` : n < 100 ? `${CN[Math.floor(n / 10)]}十${n % 10 ? CN[n % 10] : ""}` : String(n);

/* —— 真实数据：线上那 8 篇，一个字段没改 —— */
const REAL = [
  { id: "p1", t: "给我一颗可以反悔的心", s: "COMP3121", cat: "note", cr: "2026-07-20", up: "2026-08-13", min: 9, g: "growing", tags: ["计算机", "comp3121", "网络流"], ex: "网络流的引入与初步介绍" },
  { id: "e1", t: "天行健，君子以自强不息", s: null, cat: "thought", cr: "2026-07-18", up: "2026-08-05", min: 3, g: "seedling", tags: ["易经", "随笔"], ex: "丙午年六月初三，十九最后一次轻吻我" },
  { id: "h1", t: "来日方长", s: "Hackathon", cat: "project", cr: "2026-07-25", up: "2026-08-06", min: 2, g: "growing", tags: ["hackathon", "projects"], ex: "我们team第一次的线下final pitch" },
  { id: "p2", t: "貌虽不一，却有她三分骨气", s: "COMP3121", cat: "note", cr: "2026-07-25", up: "2026-08-12", min: 16, g: "evergreen", tags: ["计算机", "comp3121"], ex: "物不以貌别，终见于骨气——归约的介绍与引入" },
  { id: "p3", t: "贪恋有你的未来", s: "COMP3121", cat: "note", cr: "2026-08-10", up: "2026-08-12", min: 21, g: "growing", tags: ["计算机", "comp3121"], ex: "我贪恋的何止是当下，是你最有可能出现的未来。\n——贪心策略的介绍与引入" },
  { id: "p4", t: "以史为鉴，不泥于史", s: "COMP3121", cat: "note", cr: "2026-08-11", up: "2026-08-11", min: 25, g: "seedling", tags: ["comp3121", "计算机"], ex: "动态规划的介绍与应用" },
  { id: "p5", t: "树下的分开又重逢", s: "COMP3121", cat: "note", cr: "2026-08-11", up: "2026-08-12", min: 18, g: "growing", tags: ["comp3121", "计算机"], ex: "分开是为了更好的重逢——Divide and Conquer 的一些整理" },
  { id: "p6", t: "见招拆招，逢水架桥", s: "COMP3121", cat: "note", cr: "2026-08-12", up: "2026-08-12", min: 25, g: "growing", tags: ["comp3121", "计算机"], ex: "COMP3121的总结与一些考点" },
].map((p, i) => ({ ...p, cr: Date.parse(p.cr + "T10:00:00+10:00") + i * 1000, up: Date.parse(p.up + "T10:00:00+10:00"), links: [] }));

/* —— 规模模拟：真实 8 篇 + 按站内分类/话题习惯生成的样本。种子固定，每次一样 —— */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SYN = {
  note:    { w: .36, series: ["COMP3121", "COMP6771 · C++", "机器学习札记", "操作系统拾遗"], tags: ["计算机", "comp3121", "算法", "c++", "机器学习", "系统", "图论", "网络流"] },
  thought: { w: .22, series: ["夜读", "易经小记"], tags: ["随笔", "易经", "读书", "夜", "音乐", "yorushika"] },
  project: { w: .16, series: ["Hackathon", "Oasis 建站手记"], tags: ["hackathon", "projects", "react", "设计", "oasis"] },
  weekly:  { w: .14, series: ["周报 · 2026"], tags: ["周报", "复盘", "计划"] },
  growth:  { w: .12, series: ["晨跑"], tags: ["跑步", "习惯", "成长", "夜"] },
};
const TA = ["春", "夏", "秋", "冬", "夜", "雨", "风", "月", "星", "水", "石", "灯", "潮", "云", "雪", "海"];
const TB = ["归约", "贪心", "回溯", "分治", "并查集", "指针", "协程", "梯度", "注意力", "调度", "页表", "锁", "一杯热水", "长夜", "远行", "旧信", "晚风", "重逢", "答案", "初心", "余温", "小径"];
const TT = [(a, b) => `${a}下的${b}`, (a, b) => `当${a}遇见${b}`, (a, b) => `${a}与${b}`, (a, b) => `关于${b}的几件小事`, (a, b) => `在${a}里写${b}`, (a, b) => `${b}札记`, (a, b) => `${a}夜读${b}`, (a, b) => `一${a}一${b}`];
function synth(N) {
  if (N <= 8) return REAL.map(p => ({ ...p }));
  const r = mulberry(39), out = REAL.map(p => ({ ...p, links: [] }));
  const cats = Object.keys(SYN), t0 = Date.parse("2025-02-04"), t1 = Date.parse("2026-09-20");
  for (let i = 8; i < N; i++) {
    let x = r(), cat = cats[0]; for (const c of cats) { if ((x -= SYN[c].w) < 0) { cat = c; break; } }
    const S = SYN[cat], cr = t0 + Math.pow(r(), .8) * (t1 - t0);
    const tags = [S.tags[Math.floor(r() * S.tags.length)]]; if (r() < .6) tags.push(S.tags[Math.floor(r() * S.tags.length)]);
    const title = TT[Math.floor(r() * TT.length)](TA[Math.floor(r() * TA.length)], TB[Math.floor(r() * TB.length)]);
    const g = r(); const min = Math.round(2 + 26 * Math.pow(r(), 2.1));
    out.push({ id: "s" + i, t: title, s: r() < .5 ? S.series[Math.floor(Math.pow(r(), 1.6) * S.series.length)] : null, cat, cr, up: Math.min(NOW, cr + r() * r() * 200 * DAY),
      min, g: g < .3 ? "seedling" : g < .8 ? "growing" : "evergreen", tags: [...new Set(tags)], ex: "（样本）" + title, links: [] });
  }
  // 双链：约 14% 的文章引用一篇更早的文章，六成落在同一分类
  const byCr = [...out].sort((a, b) => a.cr - b.cr);
  byCr.forEach((p, i) => { if (i < 3 || r() > .14) return;
    const pool = r() < .6 ? byCr.slice(0, i).filter(q => q.cat === p.cat) : byCr.slice(0, i);
    const q = pool[Math.floor(r() * pool.length)]; if (q && q.id !== p.id && q.s !== p.s) p.links.push(q.id); });
  return out;
}

/* ══ 星等 = 篇幅（沿用：门限贴着真实数据定） ═════════════════════════════════ */
const MAG = [7, 12, 18, 25];
const magOf = p => { let m = 1; for (const g of MAG) if (p.min >= g) m++; return Math.min(5, m); };
const RS = [4.4, 5.4, 6.6, 8.2, 10.2];     // 石的屏幕半径 px（昼）
const RC = [1.7, 2.1, 2.6, 3.3, 4.3];      // 星核屏幕半径 px（夜）

/* ══ 落座：出生时择邻，此后终生不迁（沿用第三轮的不变量，只多一层「庭」） ════════════
   1) 分类 = 庭：第 k 个出现的分类在黄金角螺线上取一块庭址，此后不动。
   2) 庭内：老小径续一步（带种子转角）；新小径在庭内另起；散石先找同庭里共话题的亲戚。
   3) 候选评分：离锚点近、转角小、离庭心近，并对别的庭的石子强烈避让 → 庭与庭之间自然留出白砂。
   4) 任意两石间距 ≥ MIN_SEP；每一步只看已落好的石 → layout(posts[:k]) 恒为 layout(posts) 的前缀。 */
const MIN_SEP = 30, STEP = 54, ISLAND = 270, GOLD = 2.39996, SQ = .82;
function layout(posts) {
  const order = [...posts].sort((a, b) => a.cr - b.cr || (a.id < b.id ? -1 : 1));
  const CELL = 40, grid = new Map(), key = (i, j) => i * 100003 + j;
  const add = s => { const k = key(Math.floor(s.x / CELL), Math.floor(s.y / CELL)); let b = grid.get(k); if (!b) grid.set(k, b = []); b.push(s); };
  const near = (x, y, r) => { const out = []; for (let i = Math.floor((x - r) / CELL); i <= Math.floor((x + r) / CELL); i++) for (let j = Math.floor((y - r) / CELL); j <= Math.floor((y + r) / CELL); j++) { const b = grid.get(key(i, j)); if (b) for (const s of b) if (Math.hypot(s.x - x, s.y - y) < r) out.push(s); } return out; };
  const islands = new Map(), series = new Map(), stars = [];
  const choose = (anchor, dir, dist, isl, ser) => {
    if (dist === 0 && !near(anchor.x, anchor.y, MIN_SEP).length) return { x: anchor.x, y: anchor.y };
    const base = dist || STEP * .9; let best = null, bs = Infinity;
    for (let ring = 0; ring < 10; ring++) {
      const r = base * (1 + ring * .3);
      for (let m = 0; m < 18; m++) {
        const off = (m % 2 ? 1 : -1) * Math.ceil(m / 2) * (Math.PI / 9), a = dir + off;
        const x = anchor.x + Math.cos(a) * r, y = anchor.y + Math.sin(a) * r * SQ;
        if (near(x, y, MIN_SEP).length) continue;
        let sc = ring * 9 + Math.abs(off) * 8 + Math.hypot(x - isl.seed.x, (y - isl.seed.y) / SQ) * (ser ? .1 : .14);
        for (const q of near(x, y, 120)) {
          const d = Math.hypot(q.x - x, q.y - y);
          if (q.isl !== isl) sc += (120 - d) * 2.4;                       // 别的庭：让出白砂
          else if (ser && q.series !== ser.name && d < 64) sc += (64 - d) * .8;   // 同庭别的小径：稍让
        }
        if (sc < bs) { bs = sc; best = { x, y }; }
      }
    }
    return best || { x: anchor.x + MIN_SEP * 3, y: anchor.y };
  };
  for (const p of order) {
    let isl = islands.get(p.cat);
    if (!isl) {
      const k = islands.size, a = k * GOLD + .74 + (seeded("isl:" + p.cat) - .5) * .5;   // +.74：第二片庭落在正左，横版更舒展
      const r = k ? ISLAND * Math.sqrt(k) * (.92 + seeded("ir:" + p.cat) * .2) : 0;
      isl = { cat: p.cat, k, seed: { x: Math.cos(a) * r, y: Math.sin(a) * r * .66 }, stars: [] };
      islands.set(p.cat, isl);
    }
    const u = seeded("u:" + p.id), v = seeded("v:" + p.id);
    let ser = p.s ? series.get(p.s) : null, anchor, dir, dist;
    if (ser) {                                   // 老小径：从最后一块石沿走向续一步
      const t = ser.stars[ser.stars.length - 1], pv = ser.stars[ser.stars.length - 2];
      const head = pv ? Math.atan2(t.y - pv.y, t.x - pv.x) : ser.head;
      dir = head + (u - .5) * 1.7 * (v > .8 ? 1.4 : 1); dist = STEP * (.72 + v * .75); anchor = t;
    } else if (p.s) {                            // 新小径：庭内另起一处
      anchor = isl.seed; dist = isl.stars.length ? STEP * 1.6 : 0; dir = u * Math.PI * 2;
    } else {                                     // 散石：先找同庭共话题的亲戚
      let kin = null; for (let i = isl.stars.length - 1; i >= 0 && !kin; i--) if (isl.stars[i].p.tags.some(t => p.tags.includes(t))) kin = isl.stars[i];
      anchor = kin || isl.seed; dist = kin ? STEP * .95 : (isl.stars.length ? STEP * 1.2 : 0); dir = u * Math.PI * 2;
    }
    const pos = choose(anchor, dir, dist, isl, ser);
    const s = { p, x: pos.x, y: pos.y, isl, series: p.s || null, mag: magOf(p) };

/* ══ 话题圈：只用成员再算一次场，取一条等值线——Bubble Sets；离得远就退成连线（Kelp） ══ */

  const kT = view.k, F = sandField(mem, kT, s => s.R, 60, 12);

  const safeR = narrow ? innerWidth - 16 : cr.left - 48, safeB = narrow ? cr.top - 24 : innerHeight - 124;
  if (p.x > safeR || p.x < A.x + 20 || p.y > safeB || p.y < A.y + 10) {
    const tx = narrow ? innerWidth / 2 : (A.x + safeR) / 2, ty = narrow ? (A.y + safeB) / 2 : A.y + A.h / 2;
    fly({ k: view.k, x: view.x + (tx - p.x), y: view.y + (ty - p.y) }, anim);
  }
}
function renderRailSel() {
  const s = byId.get(selId); if (!s) return;
  document.querySelectorAll(".ser").forEach(d => { if (d.dataset.series === s.series) d.classList.remove("fold"); });
  const b = document.querySelector(`.post[data-id="${CSS.escape(selId)}"]`); if (b) b.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
  focus();
}

/* ══ 输入 ══════════════════════════════════════════════════════════════════════ */
const ptrs = new Map(); let drag = null, moved = 0, pinch = null;
function nearest(cx, cy) {
  let best = null, bd = Infinity;
  for (const s of L.stars) { if (s.p.cr > cutoff) continue; const p = toScreen(s), d = Math.hypot(p.x - cx, p.y - cy); if (d < bd) { bd = d; best = s; } }
  return best && bd < Math.max(best.R + 10, 18) ? best : null;
}
svg.addEventListener("pointerdown", e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); svg.setPointerCapture(e.pointerId);
  if (ptrs.size === 1) { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = 0; flyId++; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, vx: view.x, vy: view.y }; drag = null; }
});
svg.addEventListener("pointermove", e => {
  if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    const k = clamp(pinch.k * d / pinch.d, fitK * .6, fitK * 8), w = { x: (pinch.cx - pinch.vx) / pinch.k, y: (pinch.cy - pinch.vy) / pinch.k };
    view = { k, x: pinch.cx - w.x * k, y: pinch.cy - w.y * k }; write(); moved = 99; return; }
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved > 4) { svg.classList.add("dragging"); view.x = drag.vx + dx; view.y = drag.vy + dy; write(); } return; }
  const h = nearest(e.clientX, e.clientY), id = h ? h.p.id : null;
  if (id !== hovId) { hovId = id; svg.style.cursor = id ? "pointer" : ""; focus(); if (!selId) labels(); }
});
const up = e => {
  ptrs.delete(e.pointerId); svg.classList.remove("dragging");
  if (pinch && ptrs.size < 2) { pinch = null; settle(); return; }
  if (drag) { const wasTap = moved <= 4; drag = null; if (!wasTap) { settle(); return; }
    const h = nearest(e.clientX, e.clientY); select(h ? h.p.id : null); }
};
svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
svg.addEventListener("pointerleave", () => { if (hovId) { hovId = null; focus(); if (!selId) labels(); } });
svg.addEventListener("wheel", e => { e.preventDefault(); flyId++;
  const k = clamp(view.k * Math.exp(-e.deltaY * .0016), fitK * .6, fitK * 8), w = toWorld(e.clientX, e.clientY);
  view = { k, x: e.clientX - w.x * k, y: e.clientY - w.y * k }; write(); settle(); }, { passive: false });

$("#card").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (b && b.dataset.go) { select(b.dataset.go); return; }
  if (e.target.closest(".x")) select(null);
  if (e.target.closest("[data-read]")) { e.preventDefault(); toast("→ 跳到博客阅读舱 #/garden/" + selId + "（星图内不做长文阅读）"); }
});
const tree = $("#tree");
tree.addEventListener("mouseover", e => {
  const p = e.target.closest(".post"), sh = e.target.closest(".ser-h"), ch = e.target.closest(".cat-h");
  const nh = p ? p.dataset.id : null, ns = sh ? sh.parentElement.dataset.series : null, nc = ch ? ch.parentElement.dataset.cat : null;
  if (nh !== hovId || ns !== hotSer || nc !== hotCat) { hovId = nh; hotSer = ns; hotCat = nc; focus(); if (!selId) labels(); }
});
tree.addEventListener("mouseleave", () => { hovId = hotSer = hotCat = null; focus(); if (!selId) labels(); });
tree.addEventListener("click", e => {
  const p = e.target.closest(".post"); if (p) { select(p.dataset.id); return; }
  const sh = e.target.closest(".ser-h"); if (sh) { sh.parentElement.classList.toggle("fold");
    const s = L.series.find(x => x.name === sh.parentElement.dataset.series); flyTo(s.stars.filter(q => q.p.cr <= cutoff)); return; }
  const ch = e.target.closest(".cat-h"); if (ch) { const isl = L.islands.find(i => i.cat === ch.parentElement.dataset.cat); flyTo(isl.stars.filter(q => q.p.cr <= cutoff)); }
});
function flyTo(list) {
  if (!list.length) return; const b = bbox(list), A = avail();
  const k = clamp(Math.min((A.w - 200) / Math.max(b.x1 - b.x0, 60), (A.h - 200) / Math.max(b.y1 - b.y0, 60)), fitK, fitK * 3.2);
  fly({ k, x: A.x + A.w / 2 - (b.x0 + b.x1) / 2 * k, y: A.y + A.h / 2 - (b.y0 + b.y1) / 2 * k });
}
$("#tags").addEventListener("mouseover", e => { const t = e.target.closest(".tag"); const v = t ? t.dataset.tag : null; if (v !== topic && !pinTopic) { topic = v; showTopic(topic); focus(); } });
$("#tags").addEventListener("mouseleave", () => { if (!pinTopic) { topic = null; showTopic(null); focus(); } });
let pinTopic = false;
$("#tags").addEventListener("click", e => { const t = e.target.closest(".tag"); if (!t) return;
  pinTopic = !(pinTopic && topic === t.dataset.tag); topic = pinTopic ? t.dataset.tag : null;
  document.querySelectorAll(".tag").forEach(x => x.classList.toggle("on", pinTopic && x.dataset.tag === topic)); showTopic(topic); focus(); });
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); applyQuery(); focus(); labels(); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { const s = L.stars.find(s => s.p.cr <= cutoff && matches(s.p)); if (s) { select(s.p.id); e.target.blur(); } } });
addEventListener("keydown", e => {
  const typing = e.target.tagName === "INPUT";
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape") { if (typing) { e.target.value = ""; query = ""; applyQuery(); e.target.blur(); focus(); labels(); } else select(null); return; }
  if (typing) return;
  if ((e.key === "ArrowRight" || e.key === "ArrowLeft") && selId) {      // 沿小径走：飞石一块一块踩过去
    const s = byId.get(selId), line = s.series ? neighbors(selId).path : L.stars.filter(q => q.p.cat === s.p.cat && !q.series && q.p.cr <= cutoff).sort((a, b) => a.p.cr - b.p.cr);
    const i = line.indexOf(s) + (e.key === "ArrowRight" ? 1 : -1); if (line[i]) select(line[i].p.id);
  }
  if (e.key === "Enter" && selId) toast("→ 跳到博客阅读舱 #/garden/" + selId);
  if (e.key === "t") toggleTheme();
});
$("#fitBtn").onclick = () => { select(null); fit(); };
$("#railBtn").onclick = () => { document.body.classList.add("rail-off"); $("#railBtn").setAttribute("aria-pressed", "false"); fit(); };
$("#grip").onclick = () => $("#railBtn").onclick();
$("#railOn").onclick = () => { document.body.classList.remove("rail-off"); $("#railBtn").setAttribute("aria-pressed", "true"); fit(); };
$("#careBtn").onclick = e => { const on = document.body.classList.toggle("care-on"); e.currentTarget.setAttribute("aria-pressed", on); };
$("#timeBtn").onclick = e => { const on = document.body.classList.toggle("time-on"); e.currentTarget.setAttribute("aria-pressed", on); if (!on) { $("#timeR").value = 1000; setCut(Infinity); } else setCut(cutFromSlider()); };
const tspan = () => { const t = DATA.map(p => p.cr); return [Math.min(...t) - DAY, NOW]; };
const cutFromSlider = () => { const [a, b] = tspan(); return a + (b - a) * $("#timeR").value / 1000; };
let cutRaf = 0;
$("#timeR").addEventListener("input", () => { cancelAnimationFrame(cutRaf); cutRaf = requestAnimationFrame(() => setCut(cutFromSlider())); });
function setCut(c) { cutoff = c; $("#timeL").textContent = isFinite(c) ? new Date(Math.min(c, NOW)).toLocaleDateString("zh-CN") : ""; if (selId && byId.get(selId).p.cr > c) select(null);
  sand(); focus(); labels(); stat(); renderRail(); }
document.querySelectorAll(".scale button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".scale button").forEach(x => x.setAttribute("aria-pressed", x === b)); history.replaceState(null, "", "#/constellation"); build(+b.dataset.n); });
let toastT = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2600); }
function toggleTheme() {
  const night = document.documentElement.dataset.theme !== "night";
  document.documentElement.dataset.theme = night ? "night" : "day";
  $("#theme").textContent = night ? "☽ DARK" : "☼ LIGHT";
  $("#sub").textContent = night ? "池水静下来，星便落进来了。" : "白砂上的每一块石，都是写下的字。";
  if (L) labels();
}
$("#theme").onclick = toggleTheme;
let rT = 0; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { fxSize(); fit(false); }, 120); });

/* ══ 同一片空气：昼是秋天的落叶，夜是萤火（全站 OasisBackground 的简化版，星图上降到六成） ══ */
const fx = $("#fx"), fg = fx.getContext("2d"), P = [];
function fxSize() { const d = Math.min(2, devicePixelRatio || 1); fx.width = innerWidth * d; fx.height = innerHeight * d; fx.style.width = innerWidth + "px"; fx.style.height = innerHeight + "px"; fg.setTransform(d, 0, 0, d, 0, 0); }
fxSize();
const TONES = [["254,215,170", "234,122,40"], ["253,200,150", "220,88,42"], ["250,208,160", "200,70,50"]];
for (let i = 0; i < 26; i++) P.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, z: .25 + Math.random() * .75, a: Math.random() * 6.28, ph: Math.random() * 1e4, tone: TONES[i % 3], bokeh: Math.random() < .3 });
function fxFrame(t) {
  fg.clearRect(0, 0, innerWidth, innerHeight);
  const night = document.documentElement.dataset.theme === "night";
  for (const p of P) {
    if (!reduce) { if (night) { p.y -= .05 + .06 * p.z; p.x += Math.sin((t + p.ph) * .0004) * .06; } else { p.y += (.18 + .12 * p.z); p.x += Math.sin((t + p.ph) * .0006) * .3 * p.z; p.a += .004; } }
    if (p.y > innerHeight + 40) p.y = -40; if (p.y < -40) p.y = innerHeight + 40;
    if (night) { const r = (p.bokeh ? 22 : 5) * p.z * (0.8 + .4 * (Math.sin((t + p.ph) * .001) + 1) / 2), gr = fg.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      if (p.bokeh) { gr.addColorStop(0, "rgba(57,197,187,.07)"); gr.addColorStop(1, "rgba(57,197,187,0)"); } else { gr.addColorStop(0, "rgba(255,255,255,.55)"); gr.addColorStop(.2, "rgba(57,197,187,.35)"); gr.addColorStop(1, "rgba(57,197,187,0)"); }
      fg.fillStyle = gr; fg.beginPath(); fg.arc(p.x, p.y, r, 0, 6.3); fg.fill(); }
    else if (!p.bokeh) { const s = 5.5 * p.z; fg.save(); fg.translate(p.x, p.y); fg.rotate(p.a); fg.scale(.45 + .55 * Math.abs(Math.cos((t + p.ph) * .001)), 1);
      const gr = fg.createLinearGradient(0, -s, 0, s); gr.addColorStop(0, `rgba(${p.tone[0]},.55)`); gr.addColorStop(1, `rgba(${p.tone[1]},.5)`);
      fg.beginPath(); fg.moveTo(0, -s); fg.bezierCurveTo(s * .85, -s * .55, s * .65, s * .45, s * .18, s * .82); fg.lineTo(0, s * .62); fg.lineTo(-s * .18, s * .82); fg.bezierCurveTo(-s * .65, s * .45, -s * .85, -s * .55, 0, -s); fg.fillStyle = gr; fg.fill(); fg.restore(); }
  }
  if (!reduce) requestAnimationFrame(fxFrame);
}
requestAnimationFrame(fxFrame);

/* 启动：?n=160&theme=night&sel=p3 方便截图与评审 */
const Q = new URLSearchParams(location.search);
if (Q.get("theme") === "night") toggleTheme(); else $("#theme").textContent = "☼ LIGHT";
if (Q.get("rail") === "off") document.body.classList.add("rail-off");
const N0 = +(Q.get("n") || 8);
document.querySelectorAll(".scale button").forEach(x => x.setAttribute("aria-pressed", +x.dataset.n === N0));
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  build(N0);
  if (Q.get("sel")) select(Q.get("sel"), false);
  if (Q.get("topic")) { topic = Q.get("topic"); pinTopic = true; showTopic(topic); focus(); }
  if (Q.get("time")) { document.body.classList.add("time-on"); $("#timeR").value = +Q.get("time"); setCut(cutFromSlider()); }
});
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>全站梳理 · 借尺牍的光</title>
<meta name="description" content="参考尺牍的美术与 3D，逐处梳理全站：外壳、入口、花园、阅读舱、共鸣、星图、工坊、尺牍、园图与底座。五处有可开关的标本（现网 / 提案、昼 / 夜），其余是说明牌。须在 npm run dev 下打开 /docs/site-next.html。" />
<link rel="icon" href="/miku.jpg" />
<!-- 全站梳理 · 演示台。
  标本直接 import 现网的模块（lib/gl.ts、lib/sandGarden.ts、lib/solarTerms.ts、lib/supabase.ts）与生成数据
  （trackPeaks / 真文章），所以只能在 Vite 开发服务器下打开。每个标本自建自拆画布，与现网引擎同一种做法。
  地址：#<模块>&v=live|next&t=day|night，例如 #vinyl&v=next&t=night。 -->
<style>
:root {
  --bg: #F7F4EE; --panel: rgba(255, 255, 255, .66); --panel-solid: #FFFDF9; --sunk: rgba(30, 41, 59, .035);
  --ink: #2B3442; --ink2: #536072; --ink3: #8592A3; --ink4: #B6BEC9;
  --line: rgba(30, 41, 59, .09); --line2: rgba(30, 41, 59, .16);
  --teal: #39C5BB; --teal-ink: #19736C; --sakura: #FFB7C5; --zhu: #A8392B;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --serif: "EB Garamond", "LXGW WenKai Screen", Georgia, serif;
  --zh: "LXGW WenKai Screen", "Songti SC", ui-serif, serif;
  --song: "Zhuque Fangsong", "Songti SC", "STSong", serif;
  --e-out: cubic-bezier(.16, 1, .3, 1); --e-io: cubic-bezier(.65, 0, .35, 1);
  --rail: 252px; --notes: 404px; --top: 64px;
  color-scheme: light;
}
body.night {
  --bg: #0A0F1D; --panel: rgba(255, 255, 255, .045); --panel-solid: #111827; --sunk: rgba(255, 255, 255, .03);
  --ink: #E5E9F0; --ink2: #AEB7C4; --ink3: #7D8898; --ink4: #4B5565;
  --line: rgba(255, 255, 255, .08); --line2: rgba(255, 255, 255, .15);
  --teal-ink: #66DED5; --zhu: #D06A52;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.75 var(--zh);
  -webkit-font-smoothing: antialiased; transition: background-color .9s var(--e-io), color .9s var(--e-io);
  display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--notes); grid-template-rows: var(--top) minmax(0, 1fr);
  height: 100vh; overflow: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--teal-ink); text-underline-offset: 3px; }
code { font: 12px/1.5 var(--mono); background: var(--sunk); padding: 1px 5px; border-radius: 4px; color: var(--ink2); word-break: break-word; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 6px; }

/* ── 顶栏 ── */
.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px 0 24px; border-bottom: 1px solid var(--line); position: relative; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
.kick { font: 10px/1 var(--mono); letter-spacing: .32em; text-transform: uppercase; color: var(--teal-ink); white-space: nowrap; }
.brand h1 { margin: 0; font: 500 19px/1.2 var(--zh); letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand h1 em { font-style: normal; color: var(--ink3); }
.ctl { display: flex; align-items: center; gap: 10px; flex: none; }
.seg { display: inline-flex; padding: 3px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 18px -12px rgba(15, 23, 42, .25); }
.seg button { padding: 5px 14px; border-radius: 999px; font: 12px/1.4 var(--zh); letter-spacing: .12em; color: var(--ink3); transition: background-color .25s, color .25s; }
.seg button[aria-pressed="true"] { background: var(--teal); color: #fff; }
body.night .seg button[aria-pressed="true"] { color: #0A2426; background: #66DED5; }
.pill { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line2); font: 12px/1.4 var(--zh); letter-spacing: .12em; color: var(--ink2); background: var(--panel); }
.pill:hover { color: var(--ink); border-color: var(--teal); }

/* ── 左栏：模块 ── */
.rail { grid-row: 2; overflow: auto; padding: 14px 10px 24px 14px; border-right: 1px solid var(--line); }
.rail .grp { font: 10px/1 var(--mono); letter-spacing: .28em; text-transform: uppercase; color: var(--ink3); margin: 16px 10px 8px; }
.mod { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; padding: 9px 10px 10px; border-radius: 12px; transition: background-color .2s; }
.mod:hover { background: var(--sunk); }
.mod[aria-current="true"] { background: color-mix(in srgb, var(--teal) 11%, transparent); }
.mod .nm { font: 500 14px/1.4 var(--zh); letter-spacing: .04em; }
.mod .hk { grid-column: 1 / -1; font-size: 12px; line-height: 1.55; color: var(--ink3); }
.tag { font: 10px/1 var(--mono); letter-spacing: .08em; padding: 4px 6px 3px; border-radius: 5px; align-self: start; border: 1px solid var(--line2); color: var(--ink3); white-space: nowrap; }
.tag.p0 { color: var(--teal-ink); border-color: color-mix(in srgb, var(--teal) 50%, transparent); }
.tag.p1 { color: var(--ink2); border-color: var(--ink4); }
.tag.p2 { color: var(--zhu); border-color: color-mix(in srgb, var(--zhu) 45%, transparent); }
.tag.p3, .tag.keep { color: var(--ink3); border-style: dashed; }
.rail .keys { margin: 22px 10px 0; font-size: 11.5px; color: var(--ink3); line-height: 1.9; }
.rail kbd { font: 10.5px/1 var(--mono); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line2); }

/* ── 舞台 ── */
.stage { grid-row: 2; position: relative; overflow: hidden; min-height: 0; }
.spec { position: absolute; inset: 0; }
.specbar { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: max-content; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
  max-width: calc(100% - 32px); padding: 7px 10px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 14px 36px -22px rgba(15, 23, 42, .45); z-index: 4; font-size: 12px; color: var(--ink2); }
.specbar:empty { display: none; }
.specbar .b { padding: 5px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-solid); font-size: 12px; letter-spacing: .06em; white-space: nowrap; }
.specbar .b:hover { border-color: var(--teal); }
.specbar .b[aria-pressed="true"] { border-color: var(--teal); color: var(--teal-ink); background: color-mix(in srgb, var(--teal) 10%, var(--panel-solid)); }
.specbar .sep { width: 1px; height: 18px; background: var(--line2); }
.specbar label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.specbar input[type=range] { width: 140px; accent-color: var(--teal); }
.specbar .num { font: 11px/1 var(--mono); color: var(--ink3); min-width: 3.5em; display: inline-block; }
.lighttag { position: absolute; left: 12px; top: 10px; z-index: 4; font: 11px/1.5 var(--mono); letter-spacing: .06em; color: var(--ink3); pointer-events: none; display: flex; gap: 10px; align-items: center; padding: 4px 10px 4px 4px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 78%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.lighttag:empty { display: none; }
.lighttag b { font-weight: 400; color: var(--ink2); }
.lighttag .vtag { padding: 3px 8px 2px; border-radius: 6px; border: 1px solid var(--line2); color: var(--ink2); background: var(--panel); }
.lighttag .vtag.next { border-color: var(--teal); color: var(--teal-ink); }
.perf { position: absolute; right: 12px; top: 10px; z-index: 4; font: 11px/1.6 var(--mono); color: var(--ink3); text-align: right; pointer-events: none; white-space: pre; padding: 4px 8px; border-radius: 10px; background: color-mix(in srgb, var(--bg) 78%, transparent); }
.perf:empty { display: none; }

/* ── 右栏：笔记 ── */
.notes { grid-row: 2; overflow: auto; border-left: 1px solid var(--line); padding: 22px 26px 48px; font-size: 14px; line-height: 1.85; }
.notes .k { font: 10px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--teal-ink); }
.notes h2 { margin: 10px 0 6px; font: 500 21px/1.35 var(--zh); letter-spacing: .04em; }
.notes .lede { color: var(--ink2); margin: 0 0 6px; }
.notes h3 { margin: 22px 0 6px; font: 500 13px/1.4 var(--zh); letter-spacing: .22em; color: var(--ink3); display: flex; align-items: center; gap: 10px; }
.notes h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.notes ul, .notes ol { margin: 0; padding-left: 1.2em; }
.notes li { margin: 4px 0; }
.notes li::marker { color: var(--ink4); }
.notes .ev { color: var(--ink2); }
.notes .num { font-family: var(--mono); font-size: 12.5px; }
.notes table { width: 100%; border-collapse: collapse; font-size: 12.5px; line-height: 1.6; margin-top: 6px; }
.notes th, .notes td { text-align: left; padding: 6px 6px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.notes th { font-weight: 500; color: var(--ink3); font-size: 11.5px; letter-spacing: .1em; }
.notes .ask { margin-top: 18px; padding: 12px 14px; border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--zhu) 40%, transparent); }
.notes .ask b { color: var(--zhu); font-weight: 500; }

/* ── 梳理全文：一张长纸 ── */
.full { position: fixed; inset: 0; z-index: 50; background: rgba(10, 15, 29, .28); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; justify-content: center; overflow: auto; padding: 40px 16px; }
.full[hidden] { display: none; }
.full .sheet { width: min(820px, 100%); background: var(--panel-solid); border-radius: 18px; border: 1px solid var(--line); padding: 44px 56px 60px; box-shadow: 0 40px 90px -40px rgba(0, 0, 0, .5); position: relative; height: max-content; }
.full .x { position: sticky; top: 0; float: right; margin: -20px -30px 0 0; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line2); font-size: 12px; color: var(--ink2); background: var(--panel-solid); }
.full h2 { font: 500 26px/1.4 var(--zh); margin: 8px 0 12px; letter-spacing: .04em; }
.full h3 { font: 500 17px/1.4 var(--zh); margin: 30px 0 8px; letter-spacing: .06em; }
.full h3 small { font-size: 12px; color: var(--ink3); margin-left: 10px; letter-spacing: .1em; }
.full p, .full li { font-size: 14.5px; line-height: 1.9; }
.full .lede { color: var(--ink2); }
.full table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.full th, .full td { text-align: left; padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.65; }
.full th { font-weight: 500; color: var(--ink3); font-size: 12px; }
.full tr.sub td { font: 10.5px/1 var(--mono); letter-spacing: .2em; color: var(--teal-ink); padding-top: 16px; }
.full .src { font-size: 12.5px; color: var(--ink3); }

/* ── 说明牌（没有标本的模块） ── */
.placard { position: absolute; inset: 0; display: grid; place-items: center; padding: 56px 32px 32px; }
.placard figure { margin: 0; width: min(880px, 100%); }
.placard img { width: 100%; display: block; border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 30px 70px -40px rgba(15, 23, 42, .45); }
.placard figcaption { margin-top: 12px; font-size: 12.5px; color: var(--ink3); text-align: center; }
.placard .pins { position: relative; }
.placard .pin { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--zhu); color: #fff; font: 11px/22px var(--mono); text-align: center; box-shadow: 0 0 0 4px color-mix(in srgb, var(--zhu) 22%, transparent); }

/* ── 总览 ── */
.ov { position: absolute; inset: 0; overflow: auto; padding: 56px 28px 40px; }
.ov .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; max-width: 980px; margin: 0 auto; }
.ov .card { text-align: left; padding: 16px 16px 14px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(30, 41, 59, .04), 0 10px 28px -16px rgba(30, 41, 59, .14); display: flex; flex-direction: column; gap: 8px; transition: transform .25s var(--e-out), border-color .25s; }
.ov .card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--teal) 50%, transparent); }
.ov .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ov .card .nm { font: 500 15px/1.35 var(--zh); letter-spacing: .04em; }
.ov .card .say { font-size: 12.5px; line-height: 1.7; color: var(--ink2); }
.ov .card .keep { font-size: 11.5px; color: var(--ink3); line-height: 1.6; }
.ov .card .keep::before { content: "不动 · "; color: var(--ink4); }
.ov .dots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font: 10px/1.2 var(--mono); color: var(--ink3); letter-spacing: .04em; }
.ov .dots span i { display: block; height: 3px; border-radius: 2px; margin-top: 4px; background: var(--line2); position: relative; overflow: hidden; }
.ov .dots span i::after { content: ""; position: absolute; inset: 0; width: var(--v); background: var(--teal); opacity: .75; }
.ov .head { max-width: 980px; margin: 0 auto 22px; }
.ov .head p { margin: 6px 0 0; color: var(--ink2); font-size: 14px; max-width: 46em; }
.ov .head .k { font: 10px/1 var(--mono); letter-spacing: .3em; text-transform: uppercase; color: var(--teal-ink); }
.ov .legend { max-width: 980px; margin: 18px auto 0; font-size: 12px; color: var(--ink3); }

/* ── 窄屏：单列，舞台在上，笔记在下 ── */
@media (max-width: 1100px) {
  body { display: block; height: auto; overflow: auto; }
  .top { height: auto; padding: 12px 16px; flex-wrap: wrap; }
  .brand h1 { font-size: 16px; white-space: normal; }
  .rail { display: flex; gap: 6px; overflow-x: auto; border: 0; border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .rail .grp, .rail .keys, .mod .hk { display: none; }
  .mod { width: auto; flex: none; grid-template-columns: auto auto; padding: 6px 10px; }
  .stage { height: 72vh; min-height: 460px; }
  .notes { border: 0; padding: 22px 16px 60px; }
  .full .sheet { padding: 32px 22px 40px; }
  .full .x { margin: -14px -8px 0 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation-duration: .01ms !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="kick">Site Notes · after 尺牍</span><h1>借尺牍的光，<em>逐处看全站</em></h1></div>
  <div class="ctl">
    <div class="seg" id="segV" role="group" aria-label="对照"><button data-v="live">现网</button><button data-v="next">提案</button></div>
    <div class="seg" id="segT" role="group" aria-label="昼夜"><button data-t="day">昼</button><button data-t="night">夜</button></div>
    <button class="pill" id="openFull">梳理全文</button>
  </div>
</header>
<nav class="rail" id="rail" aria-label="模块"></nav>
<main class="stage" id="stage">
  <div class="spec" id="spec"></div>
  <div class="lighttag" id="lighttag"></div>
  <div class="perf" id="perf"></div>
  <div class="specbar" id="specbar"></div>
</main>
<aside class="notes" id="notes" aria-live="polite"></aside>
<div class="full" id="full" hidden><article class="sheet" id="fullSheet"></article></div>
<script type="module" src="./site-next/main.js"></script>
</body>
</html>

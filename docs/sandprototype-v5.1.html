<style>
/* ══ 1. 令牌 ═══════════════════════════════════════════════════════════════════
   颜色全部取自全站（index.css / OasisDock / OasisLights / AURA）与日本传统色；
   新增的只有「石」这一族材质色，且都有出处（白練 / 白鼠 / 銀鼠 / 利休鼠 / 鈍）。
   时长统一乘 --slow（按 m 键或 ?slow=5 慢放五倍，评审动效用）。 */
:root{
  --font-serif:"EB Garamond","LXGW WenKai Screen","Songti SC","Noto Serif SC",ui-serif,Georgia,serif;
  --font-zh:"LXGW WenKai Screen","Songti SC","Noto Serif SC",ui-serif,serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --teal:#39C5BB; --sakura:#FFB7C5; --amber:#FDBA74;
  /* 石的五色：日本传统色 */
  --shironeri:#FCFAF2;   /* 白練：高光、灯窗 */
  --shironezumi:#BDC0BA; /* 白鼠：浅石 */
  --ginnezumi:#91989F;   /* 銀鼠：石的本色 */
  --rikyu:#707C74;       /* 利休鼠：皴笔 */
  --nibi:#656765;        /* 鈍：背光面 */
  --stone-base:color-mix(in oklab,var(--shironezumi) 52%,var(--ginnezumi));
  --moss:#869457; --moss-dk:#5F6B3A;
  /* 动效令牌：进场用减速（ease-out），退场用加速（ease-in）且更短 */
  --slow:1;
  --t-xs:calc(120ms * var(--slow)); --t-sm:calc(200ms * var(--slow)); --t-md:calc(320ms * var(--slow));
  --t-lg:calc(480ms * var(--slow)); --t-xl:calc(900ms * var(--slow));
  --ease-out:cubic-bezier(.16,1,.3,1);   /* 全站 customEase */
  --ease-in:cubic-bezier(.4,0,.9,.2);    /* App.tsx 场所退场 */
  --ease-io:cubic-bezier(.65,0,.35,1);
}
[data-theme=day]{
  --paper:#FAF8F3; --ink:#334155; --ink2:#5B6B80; --ink3:#7F8B9C;

  --shadow:0 18px 50px -30px rgba(15,23,42,.35);
  --ring-base:#64748B; --ring-o:.2; --ring-in-o:.32; --rake:rgba(100,116,139,.085); --pool:transparent;
  --step:#D6D2C8; --step-rim:rgba(101,103,101,.28);
  --bridge:rgba(100,116,139,.5);
  --ln-body:#8E938C; --ln-win:#FCFAF2;
  --stone-o:1; --star-o:0; --dim:.24;
  --halo-stroke:rgba(250,248,243,.92);
}
[data-theme=night]{
  --paper:#0A0F1D; --ink:#E2E8F0; --ink2:#94A3B8; --ink3:#7A8AA0;
  --accent:#66DED5; --accent-ink:#6FD8CF; --accent-line:#66DED5;
  --cat-ink-mix:88%; --cat-ink-base:#F8FAFC;
  --glass:rgba(12,18,34,.68); --glass-edge:rgba(255,255,255,.09); --line:rgba(255,255,255,.09);
  --shadow:0 20px 48px -20px rgba(0,0,0,.72);
  --ring-base:#66DED5; --ring-o:.09; --ring-in-o:.17; --rake:rgba(102,222,213,.018); --pool:rgba(102,222,213,.022);
  --step:#3A4556; --step-rim:transparent;
  --bridge:rgba(255,183,197,.62);
  --ln-body:#26303F; --ln-win:#FDBA74;
  --stone-o:0; --star-o:1; --dim:.2;
  --halo-stroke:rgba(10,15,29,.9);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--font-serif);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  transition:background-color calc(1200ms * var(--slow)) ease,color calc(1200ms * var(--slow)) ease}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ══ 2. 同一片空气 ═════════════════════════════════════════════════════════════ */
.wash{position:fixed;inset:0;pointer-events:none;transition:opacity calc(1200ms * var(--slow));
  background:radial-gradient(120% 90% at 15% 12%,rgba(253,226,196,.55) 0%,rgba(250,248,243,.45) 42%,transparent 70%),
             radial-gradient(90% 80% at 88% 92%,rgba(57,197,187,.07) 0%,transparent 60%)}

#sky{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity calc(900ms * var(--slow)) ease}
[data-theme=night] #sky{opacity:.9;transition-delay:calc(260ms * var(--slow))}
#fx{position:fixed;inset:0;pointer-events:none;opacity:.6}
.vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 150px rgba(0,0,0,.05)}
[data-theme=night] .vignette{box-shadow:inset 0 0 150px rgba(0,0,0,.8)}
.hud{position:fixed;inset:32px;pointer-events:none;opacity:.3;color:#94A3B8;font:12px var(--font-mono)}
.hud i{position:absolute;font-style:normal;line-height:1}

.pills{position:fixed;top:32px;left:32px;display:flex;gap:12px;z-index:30}

  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 2px rgba(15,23,42,.05);
  transition:color var(--t-md),border-color var(--t-md),background-color var(--t-md)}

.pill[aria-pressed=true]{color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent) 55%,transparent);background:color-mix(in srgb,var(--accent) 9%,var(--glass))}
.pill:active{transform:scale(.97)}

.scale button[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent-ink)}
.scale i{width:1px;height:14px;background:var(--line);margin:0 4px}

.place-head{position:fixed;top:92px;left:50%;transform:translateX(-50%);text-align:center;z-index:5;pointer-events:none;width:min(560px,80vw)}
.eyebrow{font:10px var(--font-mono);letter-spacing:.5em;text-transform:uppercase;color:var(--ink3)}
.place-head .eyebrow{color:color-mix(in srgb,var(--accent) 80%,transparent)}
.place-head p{margin:10px 0 0;font-style:italic;font-size:14px;color:var(--ink3);transition:opacity var(--t-md)}

/* ══ 3. 地图 ═════════════════════════════════════════════════════════════════════ */
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none}
#stage.dragging{cursor:grabbing}
.rk{fill:none;stroke:var(--rake);stroke-width:1;vector-effect:non-scaling-stroke;transition:stroke calc(900ms * var(--slow))}
.rg{fill:none;stroke:color-mix(in oklab,var(--c,#64748B) 34%,var(--ring-base));stroke-opacity:var(--ring-o);stroke-width:1;vector-effect:non-scaling-stroke;
  transition:stroke calc(900ms * var(--slow)),stroke-opacity calc(900ms * var(--slow))}
.rg.in{stroke-opacity:var(--ring-in-o)}
/* 进场：砂纹像被耙子一圈圈耙出来（仅桌面，一次性） */
.entering .rg{stroke-dasharray:1;stroke-dashoffset:1;animation:rake calc(1100ms * var(--slow)) var(--ease-io) forwards;animation-delay:var(--rd,0ms)}
@keyframes rake{to{stroke-dashoffset:0}}
.poolfill{fill:var(--pool);stroke:none}
.topic{fill:color-mix(in srgb,var(--sakura) 12%,transparent);stroke:var(--sakura);stroke-width:1.2;stroke-dasharray:4 5;vector-effect:non-scaling-stroke;
  animation:fadein var(--t-md) var(--ease-out) both}
.kelp{fill:none;stroke:var(--sakura);stroke-width:1.2;stroke-dasharray:1 5;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:fadein var(--t-md) var(--ease-out) both}

/* 小径：昼是千鸟打的飞石，夜是星座连线；入口立一盏石灯笼 */
.stp{fill:var(--step);stroke:var(--step-rim);stroke-width:.7}
.stp-sh{fill:rgba(30,41,59,.10)}
.path.lit .stp{fill:color-mix(in oklab,var(--accent) 34%,var(--step))}
.chain{fill:none;stroke:rgba(226,232,240,.5);stroke-width:1;vector-effect:non-scaling-stroke}

.ln-body{fill:var(--ln-body);transition:fill calc(900ms * var(--slow))}
.ln-win{fill:var(--ln-win);transition:fill calc(900ms * var(--slow))}
.ln-glow{opacity:var(--star-o);transition:opacity calc(900ms * var(--slow))}
.ln-sh{fill:rgba(30,41,59,.12);opacity:var(--stone-o)}
.stepg,.chain,.lanterng{transition:opacity var(--t-lg) var(--ease-out)}
/* 桥：昼是石桥（双线），夜是鹊桥（樱粉虚线） */
.br-a{fill:none;stroke:var(--bridge);stroke-width:3.6;vector-effect:non-scaling-stroke;opacity:var(--stone-o)}

.br-n{fill:none;stroke:var(--bridge);stroke-width:1.1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke;opacity:var(--star-o)}
.hit{fill:none;stroke:transparent;stroke-width:12;vector-effect:non-scaling-stroke;pointer-events:stroke}
.spoke{fill:none;stroke:color-mix(in srgb,var(--accent) 70%,transparent);stroke-width:1;stroke-dasharray:1 4;stroke-linecap:round;vector-effect:non-scaling-stroke;animation:fadein var(--t-md) var(--ease-out) both}
.bridge,.path{transition:opacity var(--t-md) var(--ease-out)}

/* ══ 4. 石与星：同一个节点两种光。几何不变，只换光 ═══════════════════════════════════ */
.node{transition:opacity var(--t-lg) var(--ease-out)}

.node.future{opacity:0;pointer-events:none;transition:opacity var(--t-sm) var(--ease-in)}
.stone{opacity:var(--stone-o);transition:opacity calc(520ms * var(--slow)) var(--ease-io) var(--wd,0ms)}
.star{opacity:var(--star-o);transition:opacity calc(620ms * var(--slow)) var(--ease-io) var(--wd,0ms),transform calc(620ms * var(--slow)) var(--ease-out) var(--wd,0ms);transform-box:fill-box;transform-origin:center}
[data-theme=day] .star{transform:scale(.55)}
.lift{transform-box:fill-box;transform-origin:center;transition:transform var(--t-xs) var(--ease-out)}
.node.hov .lift{transform:translate(-.6px,-1.2px) scale(1.08)}
.st-sh{transition:transform var(--t-xs) var(--ease-out),opacity calc(520ms * var(--slow)) var(--ease-io) var(--wd,0ms)}
.node.hov .st-sh{transform:translate(.8px,1px) scale(1.1)}
.st-body{stroke:rgba(71,85,105,.26);stroke-width:.6}
.st-body.seed{fill:color-mix(in oklab,color-mix(in oklab,var(--c) 20%,var(--stone-base)) 26%,var(--shironeri));stroke:color-mix(in oklab,var(--c) 30%,var(--ginnezumi));stroke-width:.9;stroke-dasharray:2 1.6}
.st-hi{fill:var(--shironeri);opacity:.55}
.st-cun{fill:none;stroke:var(--rikyu);stroke-width:.75;stroke-linecap:round;opacity:.42}
.st-moss{fill:var(--moss)}
.st-moss-dot{fill:var(--moss-dk)}
.sg0{stop-color:color-mix(in oklab,color-mix(in oklab,var(--c) 20%,var(--stone-base)) 42%,var(--shironeri))}
.sg1{stop-color:color-mix(in oklab,var(--c) 20%,var(--stone-base))}
.sg2{stop-color:color-mix(in oklab,color-mix(in oklab,var(--c) 20%,var(--stone-base)) 58%,var(--nibi))}
.sr-core{fill:color-mix(in oklab,var(--c) 16%,#fff)}
.sr-core.seed{opacity:.5}
.sr-seedring{fill:none;stroke:rgba(226,232,240,.38);stroke-width:.8;stroke-dasharray:1.2 1.8}

.sel-ring{fill:none;stroke:var(--accent-line);stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:opacity var(--t-sm)}
.node.sel .sel-ring{opacity:1;animation:draw var(--t-md) var(--ease-out) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.care{fill:none;stroke:var(--sakura);stroke-width:1.1;stroke-dasharray:2 3;opacity:0;transition:opacity var(--t-md)}
body.care-on .node.tend .care{opacity:.95}
.fresh{fill:none;stroke:var(--sakura);stroke-width:1;transform-box:fill-box;transform-origin:center;animation:fresh calc(5s * var(--slow)) var(--ease-out) infinite}

@keyframes fresh{0%{transform:scale(1);opacity:.7}70%,100%{transform:scale(3.4);opacity:0}}
.bloom{fill:none;stroke:var(--accent);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:bloom calc(1500ms * var(--slow)) var(--ease-out) forwards}
.bloom.b2{stroke:var(--sakura);animation-delay:calc(180ms * var(--slow));opacity:0}
@keyframes bloom{0%{transform:scale(.6);opacity:.8}100%{transform:scale(5.5);opacity:0}}
/* 进场：石按种下先后逐块落定，落地时砂面荡一圈 */
.land{fill:none;stroke:var(--ink3);stroke-width:.8;opacity:0;transform-box:fill-box;transform-origin:center}
.entering .node .lift{animation:drop calc(420ms * var(--slow)) var(--ease-out) both;animation-delay:var(--ed)}

.entering .node .land{animation:land calc(900ms * var(--slow)) var(--ease-out) forwards;animation-delay:calc(var(--ed) + 140ms * var(--slow))}
@keyframes drop{0%{opacity:0;transform:translateY(-7px) scale(.7)}60%{opacity:1;transform:translateY(0) scale(1.05)}100%{opacity:1;transform:none}}

/* 昼夜切换：注记先隐去 160ms（加速）→ 光变 → 再现 320ms（减速）。字色与描边若跟着底色一起渐变，中段会糊成一团灰 */
.labels{transition:opacity var(--t-md) var(--ease-out)}
.theme-swap .labels{opacity:0;transition:opacity calc(160ms * var(--slow)) var(--ease-in)}
.entering .relg,.entering .lanterng{animation:fadein var(--t-lg) var(--ease-out) both;animation-delay:calc(var(--ld,600ms) - 200ms * var(--slow))}

/* 注记：字号只用站内阶梯 16 / 13 / 11 / 10 */

/* ══ 5. 玻璃面板 ══════════════════════════════════════════════════════════════════ */
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);

/* —— 真实数据：线上那 8 篇，一个字段没改 —— */
const REAL = [
  { id: "p1", t: "给我一颗可以反悔的心", s: "COMP3121", cat: "note", cr: "2026-07-20", up: "2026-08-13", min: 9, g: "growing", tags: ["计算机", "comp3121", "网络流"], ex: "网络流的引入与初步介绍" },

].map((p, i) => ({ ...p, cr: Date.parse(p.cr + "T10:00:00+10:00") + i * 1000, up: Date.parse(p.up + "T10:00:00+10:00"), links: [] }));

/* —— 规模模拟：真实 8 篇 + 按站内分类/话题习惯生成的样本。种子固定，每次一样 —— */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SYN = {
  note:    { w: .36, series: ["COMP3121", "COMP6771 · C++", "机器学习札记", "操作系统拾遗"], tags: ["计算机", "comp3121", "算法", "c++", "机器学习", "系统", "图论", "网络流"] },
  thought: { w: .22, series: ["夜读", "易经小记"], tags: ["随笔", "易经", "读书", "夜", "音乐", "yorushika"] },
  project: { w: .16, series: ["Hackathon", "Oasis 建站手记"], tags: ["hackathon", "projects", "react", "设计", "oasis"] },
  weekly:  { w: .14, series: ["周报 · 2026"], tags: ["周报", "复盘", "计划"] },
  growth:  { w: .12, series: ["晨跑"], tags: ["跑步", "习惯", "成长", "夜"] },

const TA = ["春", "夏", "秋", "冬", "夜", "雨", "风", "月", "星", "水", "石", "灯", "潮", "云", "雪", "海"];
const TB = ["归约", "贪心", "回溯", "分治", "并查集", "指针", "协程", "梯度", "注意力", "调度", "页表", "锁", "一杯热水", "长夜", "远行", "旧信", "晚风", "重逢", "答案", "初心", "余温", "小径"];
const TT = [(a, b) => `${a}下的${b}`, (a, b) => `当${a}遇见${b}`, (a, b) => `${a}与${b}`, (a, b) => `关于${b}的几件小事`, (a, b) => `在${a}里写${b}`, (a, b) => `${b}札记`, (a, b) => `${a}夜读${b}`, (a, b) => `一${a}一${b}`];
function synth(N) {
  if (N <= 8) return REAL.map(p => ({ ...p, links: [] }));
  const r = mulberry(39), out = REAL.map(p => ({ ...p, links: [] }));
  const cats = Object.keys(SYN), t0 = Date.parse("2025-02-04"), t1 = Date.parse("2026-09-20");

    const title = TT[Math.floor(r() * TT.length)](TA[Math.floor(r() * TA.length)], TB[Math.floor(r() * TB.length)]);
    const g = r(); const min = Math.round(2 + 26 * Math.pow(r(), 2.1));
    out.push({ id: "s" + i, t: title, s: r() < .5 ? S.series[Math.floor(Math.pow(r(), 1.6) * S.series.length)] : null, cat, cr, up: Math.min(NOW, cr + r() * r() * 200 * DAY),

  }

  byCr.forEach((p, i) => { if (i < 3 || r() > .14) return;
    const pool = r() < .6 ? byCr.slice(0, i).filter(q => q.cat === p.cat) : byCr.slice(0, i);
    const q = pool[Math.floor(r() * pool.length)]; if (q && q.id !== p.id && q.s !== p.s) p.links.push(q.id); });
  return out;

/* ══ 尺寸阶 ══════════════════════════════════════════════════════════════════════
   星等 = 篇幅（门限贴真实数据：7 / 12 / 18 / 25 分钟）。
   相邻两档半径 ×1.26（面积 ×1.59）。人眼对圆面积的感知约为实际面积的 0.87 次方（Flannery），

const MAG = [7, 12, 18, 25];

/* ══ 砂纹：每片庭各算一套；最外一圈同时是直纹的蒙版洞与夜间水面 ═══════════════════ */
